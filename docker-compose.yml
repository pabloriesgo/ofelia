services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ofelia
      POSTGRES_USER: ofelia
      POSTGRES_PASSWORD: ofelia
    ports:
      - "5432:5432"
    volumes:
      - ofelia-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofelia"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ofelia
      DB_USER: ofelia
      DB_PASSWORD: ofelia
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  ofelia-db-data:
